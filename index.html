<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Liste des produits à acheter en gros — sashes et tissus, avec photos, couleurs et mode marché. Synchronisée automatiquement entre tous les appareils via GitHub." />
    <meta name="theme-color" content="#0c0f14" />
    <meta name="color-scheme" content="dark light" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mes achats" />

    <link rel="icon" href="icons/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="icons/app-icon.svg" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon-180x180.png" />
    <link rel="manifest" href="manifest.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap"
    />

    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/views.css" />

    <title>Mes achats — Sashes &amp; Tissus</title>
  </head>
  <body>
    <div class="app">
      <header class="appbar">
        <a class="brand" href="#/accueil" aria-label="Mes achats — accueil">
          <span class="brand-mark">S<span>&amp;</span>T</span>
          <span class="brand-text">
            <strong>Mes achats</strong>
            <small>Sashes &amp; tissus · grossiste</small>
          </span>
        </a>

        <nav class="appbar-nav" id="appbar-nav" aria-label="Navigation principale"></nav>

        <div class="appbar-actions">
          <button type="button" class="sync-pill" id="sync-pill" data-action="sync-now"
                  aria-live="polite" title="Synchroniser maintenant">Connexion…</button>
          <button type="button" class="icon-btn" id="install-btn" data-action="install-app"
                  aria-label="Installer l'application" title="Installer l'application" hidden>
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3v13" /><path d="m6 11 6 6 6-6" /><path d="M5 21h14" />
            </svg>
          </button>
          <button type="button" class="icon-btn" data-action="open-form" aria-label="Ajouter un produit" title="Ajouter un produit (N)">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14" /><path d="M12 5v14" />
            </svg>
          </button>
        </div>
      </header>

      <main class="page" id="page">
        <div class="banners" id="banners"></div>
        <div id="view">
          <p class="skeleton">Chargement de la liste…</p>
        </div>
      </main>

      <button type="button" class="btn btn--primary fab" data-action="open-form" aria-label="Ajouter un produit">
        <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14" /><path d="M12 5v14" />
        </svg>
        Produit
      </button>

      <nav class="bottomnav" id="bottomnav" aria-label="Navigation">
        <div class="bottomnav-inner" id="bottomnav-inner"></div>
      </nav>

      <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>
    </div>

    <noscript>
      <p style="padding:24px;font-family:system-ui">
        Cette application nécessite JavaScript pour afficher la liste d'achats.
      </p>
    </noscript>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
