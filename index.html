<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Liste des produits à acheter en gros — sashes et tissus, avec photos, couleurs et prix. Synchronisée automatiquement entre tous les appareils via GitHub." />
    <!-- La couleur de la barre suit le fond réel du thème ; `theme.js` la
         met à jour au changement, ces deux déclarations couvrent le premier
         rendu, avant que le script ne s'exécute. -->
    <meta name="theme-color" content="#f4f6f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a101c" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mes achats" />

    <link rel="icon" href="icons/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="icons/app-icon.svg" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon-180x180.png" />
    <link rel="manifest" href="manifest.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght,SOFT,WONK@9..144,500;600;700&display=swap"
    />

    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/views.css" />

    <title>Mes achats — Sashes &amp; Tissus</title>
  </head>
  <body>
    <a class="skip-link" href="#page">Aller à la liste</a>

    <div class="app">
      <!--
        Barre de statut : elle ne porte plus la navigation, seulement
        l'identité, l'écran courant et la synchronisation. Sur téléphone,
        la navigation est entièrement dans la barre du bas — c'est la
        seule qui reste sous le pouce.
      -->
      <header class="statusbar">
        <a class="brand" href="#/liste" aria-label="Mes achats — ma liste">
          <span class="brand-mark" aria-hidden="true">S<span>&amp;</span>T</span>
          <span class="brand-screens">
            <span class="brand-text">
              <strong>Mes achats</strong>
              <small>Sashes &amp; tissus · grossiste</small>
            </span>
            <!-- Nom de l'écran courant, injecté par `shell.js`. Le titre
                 de page est ici plutôt que dans la vue : il reste visible
                 pendant que la liste défile. -->
            <span class="brand-screen" id="screen-title" aria-live="polite">Liste</span>
          </span>
        </a>

        <nav class="statusbar-nav" id="appbar-nav" aria-label="Navigation principale"></nav>

        <div class="statusbar-actions">
          <button type="button" class="sync-pill" id="sync-pill" data-action="sync-now"
                  aria-live="polite" title="Synchroniser maintenant">Connexion…</button>
          <button type="button" class="icon-btn" id="install-btn" data-action="install-app"
                  aria-label="Installer l'application" title="Installer l'application" hidden>
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3v13" /><path d="m6 11 6 6 6-6" /><path d="M5 21h14" />
            </svg>
          </button>
          <button type="button" class="icon-btn icon-btn--accent" id="add-btn" data-action="open-form"
                  aria-label="Ajouter un produit" title="Ajouter un produit (N)">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14" /><path d="M12 5v14" />
            </svg>
          </button>
        </div>
      </header>

      <main class="page" id="page" tabindex="-1">
        <div class="banners" id="banners"></div>
        <div id="view">
          <p class="skeleton">Chargement de la liste…</p>
        </div>
      </main>

      <!-- Navigation principale. Toujours présente : sur téléphone c'est
           la seule barre visible en permanence. -->
      <nav class="tabbar" id="bottomnav" aria-label="Navigation principale">
        <div class="tabbar-inner" id="bottomnav-inner"></div>
      </nav>

      <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>
    </div>

    <noscript>
      <p class="noscript">Cette application nécessite JavaScript pour afficher la liste d'achats.</p>
    </noscript>

    <script>
      /* Filet de sécurité, hors module. Le service worker sert désormais le
         code « réseau d'abord » sans le mettre en cache : ce bloc ne sert donc
         plus qu'à rattraper un démarrage cassé (cache HTTP du navigateur,
         version.json absent) et à ne pas rester bloqué sur
         « Chargement de la liste… ». */
      (function () {
        var KEY = 'mes-achats-recovery'
        var KEY_AT = 'mes-achats-recovery-at'
        var LIMIT = 2
        var tried = 0
        try {
          tried = Number(sessionStorage.getItem(KEY)) || 0
        } catch (error) {
          /* navigation privée : la tentative unique reste protégée par la durée */
        }
        if (tried >= LIMIT) return
        if (Date.now() - Number(sessionStorage.getItem(KEY_AT) || 0) < 60000) return

        function reloadOnce() {
          tried += 1
          try {
            sessionStorage.setItem(KEY, String(tried))
            sessionStorage.setItem(KEY_AT, String(Date.now()))
          } catch (error) {
            /* sans stockage, une seule tentative par chargement */
          }
          var url = new URL(window.location.href)
          url.searchParams.set('v', 'reload-' + tried)
          window.location.replace(url.toString())
        }

        function recover() {
          if (!navigator.serviceWorker || !window.isSecureContext) {
            reloadOnce()
            return
          }
          navigator.serviceWorker
            .getRegistration()
            .then(function (registration) {
              if (!registration) {
                reloadOnce()
                return
              }
              registration.update()
              if (!registration.waiting) {
                reloadOnce()
                return
              }
              registration.waiting.postMessage({ type: 'SKIP_WAITING' })
              navigator.serviceWorker.addEventListener('controllerchange', reloadOnce)
            })
            .catch(reloadOnce)
        }

        window.addEventListener(
          'error',
          function () {
            recover()
          },
          true,
        )

        /* Repli : si rien n'a été peint après 8 s, l'application n'a pas démarré. */
        document.addEventListener('DOMContentLoaded', function () {
          setTimeout(function () {
            var view = document.getElementById('view')
            if (view && /Chargement de la liste/.test(view.textContent)) recover()
          }, 8000)
        })
      })()
    </script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
