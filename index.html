  <body>
    <a class="skip-link" href="#page">Aller au contenu</a>

    <div class="app">
      <!-- Rail : navigation permanente des grands écrans. Le dock et le
           bouton d'action flottant prennent le relais sur téléphone. -->
      <aside class="rail" aria-label="Barre latérale">
        <a class="rail-brand" href="#/liste" aria-label="Mes achats — ma liste">
          <span class="rail-logo" aria-hidden="true">S<span>&amp;</span>T</span>
          <span class="rail-name">
            <strong>Mes achats</strong>
            <small>Sashes &amp; tissus</small>
          </span>
        </a>

        <button type="button" class="rail-add" id="rail-add" data-action="fab-add">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14" /><path d="M12 5v14" />
          </svg>
          <span id="rail-add-label">Ajouter un produit</span>
          <kbd>N</kbd>
        </button>

        <nav class="rail-nav" id="rail-nav" aria-label="Navigation principale"></nav>

        <div class="rail-foot">
          <a class="rail-link" href="#/reglages" data-route="reglages">
            <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 21v-7" /><path d="M4 10V3" /><path d="M12 21v-9" /><path d="M12 8V3" />
              <path d="M20 21v-5" /><path d="M20 12V3" /><path d="M1 14h6" /><path d="M9 8h6" /><path d="M17 16h6" />
            </svg>
            <span>Réglages</span>
          </a>
          <button type="button" class="rail-link" id="install-btn" data-action="install-app" hidden>
            <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 3v13" /><path d="m6 11 6 6 6-6" /><path d="M5 21h14" />
            </svg>
            <span>Installer l’application</span>
          </button>
          <button type="button" class="sync-card" id="sync-card" data-action="sync-now"
                  aria-live="polite" title="Synchroniser maintenant">
            <span class="sync-card-head">Connexion…</span>
            <small>Liste locale</small>
          </button>
        </div>
      </aside>

      <div class="workspace">
        <header class="topbar">
          <a class="topbar-brand" href="#/liste" aria-label="Mes achats — ma liste">
            <span class="topbar-logo" aria-hidden="true">S<span>&amp;</span>T</span>
            <span class="topbar-title" id="screen-title" aria-live="polite">Liste</span>
          </a>
          <div class="topbar-actions">
            <button type="button" class="sync-mini" id="sync-mini" data-action="sync-now"
                    aria-label="Synchroniser maintenant" title="Synchroniser maintenant"></button>
            <a class="topbar-btn" href="#/reglages" aria-label="Réglages" title="Réglages">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M4 21v-7" /><path d="M4 10V3" /><path d="M12 21v-9" /><path d="M12 8V3" />
                <path d="M20 21v-5" /><path d="M20 12V3" /><path d="M1 14h6" /><path d="M9 8h6" /><path d="M17 16h6" />
              </svg>
            </a>
          </div>
        </header>

        <main class="page" id="page" tabindex="-1">
          <div class="banners" id="banners"></div>
          <div id="view">
            <p class="skeleton">Chargement de la liste…</p>
          </div>
        </main>
      </div>

      <nav class="dock" id="dock" aria-label="Navigation principale">
        <div class="dock-inner" id="dock-inner"></div>
      </nav>

      <button type="button" class="fab" id="fab" data-action="fab-add"
              aria-label="Ajouter un produit" title="Ajouter un produit">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h14" /><path d="M12 5v14" />
        </svg>
      </button>

      <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>
    </div>

    <noscript>
      <p class="noscript">Cette application nécessite JavaScript pour afficher la liste d'achats.</p>
    </noscript>

    <script>
      /* Filet de sécurité hors module : rattrape un démarrage cassé sans
         boucler (2 essais maximum, 60 s entre deux). */
      (function () {
        var KEY = 'mes-achats-recovery'
        var KEY_AT = 'mes-achats-recovery-at'
        var LIMIT = 2
        var tried = 0
        try {
          tried = Number(sessionStorage.getItem(KEY)) || 0
        } catch (error) {}
        if (tried >= LIMIT) return
        if (Date.now() - Number(sessionStorage.getItem(KEY_AT) || 0) < 60000) return

        function reloadOnce() {
          tried += 1
          try {
            sessionStorage.setItem(KEY, String(tried))
            sessionStorage.setItem(KEY_AT, String(Date.now()))
          } catch (error) {}
          var url = new URL(window.location.href)
          url.searchParams.set('v', 'reload-' + tried)
          window.location.replace(url.toString())
        }

        function recover() {
          if (!navigator.serviceWorker) return reloadOnce()
          navigator.serviceWorker.getRegistration().then(function (registration) {
            if (!registration) return reloadOnce()
            registration.update()
            if (registration.waiting) {
              registration.waiting.postMessage({ type: 'SKIP_WAITING' })
              navigator.serviceWorker.addEventListener('controllerchange', reloadOnce)
              return
            }
            reloadOnce()
          }).catch(reloadOnce)
        }

        window.addEventListener('error', function () { recover() }, true)
        document.addEventListener('DOMContentLoaded', function () {
          setTimeout(function () {
            var view = document.getElementById('view')
            if (view && /Chargement de la liste/.test(view.textContent)) recover()
          }, 8000)
        })
      })()
    </script>
    <script type="module" src="src/main.js?v=13"></script>
  </body>
</html>
