<!doctype html>
<!--
  Page de vérification — sert de banc d'essai à `node tools/check.mjs`.

  Elle importe les vrais modules de l'application (aucun double des styles ni
  du rendu dans le test) et reproduit fidèlement la délégation de clic de
  `src/main.js`, pour que les vérifications portent sur le comportement réel.

  Elle ne sert à rien en production : `tools/check.mjs` la sert brièvement
  dans un navigateur sans interface, puis lit le rapport qu'elle poste.
-->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vérifications</title>
    <script>
      /* Le thème est choisi en ligne de commande (`node tools/check.mjs
         --theme dark`). Il est posé avant les feuilles de style pour que
         la première mesure porte déjà sur le bon thème — sinon les
         vérifications de jetons mesureraient toujours le clair. */
      document.documentElement.dataset.theme = new URLSearchParams(location.search).get('theme') === 'dark' ? 'dark' : 'light'
    </script>
    <link rel="stylesheet" href="../src/styles/tokens.css" />
    <link rel="stylesheet" href="../src/styles/base.css" />
    <link rel="stylesheet" href="../src/styles/layout.css" />
    <link rel="stylesheet" href="../src/styles/components.css" />
    <link rel="stylesheet" href="../src/styles/views.css" />
    <style>
      body { padding: 24px; }
      .chg { max-width: 1100px; margin: 0 auto; }
      /* Le.sample rejoue la coque réelle de l'application (bandeau de
         titre, en-tête de vue, barre d'outils, état vide). Ces quatre
         blocs sont les seuls qui se dimensionnent en largeur de colonne,
         et donc les seuls qui peuvent déborder sur un téléphone. */
      .sample { margin-top: 32px; border: 1px dashed #bbb; border-radius: 8px; overflow: hidden; }
      .sample .app { min-height: 0; }
    </style>
  </head>
  <body>
    <div class="chg">
      <h1 style="margin: 0 0 16px; font-size: 20px">Banc d’essai — rendu réel</h1>
      <div class="grid" id="grid"></div>
      <div id="layouts"></div>
      <div class="sample" id="shell"></div>
    </div>

    <script type="module">
      import { renderProductCard } from '../src/screens/list/card.js'
      import { openColorPreview, openPhotoPreview } from '../src/ui/preview.js'
      import { CARD_LAYOUTS, CARD_LAYOUT_VALUES } from '../src/data/products-model.js'
      import { icon } from '../src/ui/icons.js'

      const results = []
      const check = (name, pass, detail = '') => results.push({ name, pass: Boolean(pass), detail: String(detail) })
      const near = (a, b, tol = 2) => Math.abs(a - b) <= tol

      const PHOTO =
        'data:image/svg+xml;base64,' +
        btoa(
          unescape(
            encodeURIComponent(
              '<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600">' +
                '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
                '<stop offset="0" stop-color="#2b6cb0"/><stop offset="1" stop-color="#f6ad55"/>' +
                '</linearGradient></defs><rect width="800" height="600" fill="url(#g)"/>' +
                '<text x="400" y="310" font-family="sans-serif" font-size="46" fill="#fff" text-anchor="middle">photo</text></svg>',
            ),
          ),
        )

      const base = { typeLabel: 'Ceinture', priority: 'haute', status: 'todo', createdAt: '2026-09-12T09:10:00.000Z' }
      const items = [
        { ...base, id: 'rgb', name: 'Ceinture satin ivoire', type: 'ceinture', qty: 25, unit: 'piece', price: 1.5, hasPrice: true, lineTotal: 37.5, qtyLabel: '25 pc', color: 'ivoire', colorRgb: { r: 239, g: 227, b: 211 }, photo: PHOTO },
        { ...base, id: 'named', name: 'Tulle rose bébé', type: 'tulle', qty: 4, unit: 'metre', qtyLabel: '4 m', color: 'rose bébé' },
        { ...base, id: 'unknown', name: 'Fil doré', type: 'fil', qty: 6, unit: 'rouleau', qtyLabel: '6 rlt', color: 'finition inconnue', priority: 'normale' },
        { ...base, id: 'plain', name: 'Dentelle écrue', type: 'dentelle', qty: 3, unit: 'metre', qtyLabel: '3 m' },
        { ...base, id: 'bought', name: 'Ruban bleu roi', type: 'ruban', qty: 12, unit: 'rouleau', qtyLabel: '12 rlt', color: 'bleu roi', colorRgb: { r: 42, g: 82, b: 190 }, priority: 'basse', isBought: true, photo: PHOTO },
        { ...base, id: 'nophoto', name: 'Fil de coton', type: 'fil', qty: 2, unit: 'rouleau', qtyLabel: '2 rlt', color: 'écru' },
      ]

      const grid = document.getElementById('grid')
      /* `layout` est passé explicitement : sans cela, `.map` fournirait
         l'index en deuxième argument et le mode serait indéfini. */
      grid.innerHTML = items.map((item) => renderProductCard(item, 'card')).join('')
      const card = (id) => grid.querySelector(`article[data-id="${id}"]`)
      const byId = (id) => items.find((item) => item.id === id) || null

      /* Les trois présentations, rendues côte à côte pour les comparer. */
      const LAYOUTS = ['card', 'mosaic', 'row']
      const layouts = document.getElementById('layouts')
      layouts.innerHTML = LAYOUTS.map(
        (layout) => `<div class="grid grid--${layout}" data-layout="${layout}">${items
          .map((item) => renderProductCard(item, layout))
          .join('')}</div>`,
      ).join('')

      /* --- Délégation de clic, calquée sur src/main.js (initActions) --------- */
      const HANDLERS = {
        'preview-color': (node) => openColorPreview(byId(node.dataset.id)),
        'preview-photo': (node) => openPhotoPreview(byId(node.dataset.id)),
        /* Comme dans `src/main.js`, la coche est une action à part entière :
           sans ce gestionnaire, le clic retomberait sur l'ouverture de la
           fiche et le banc ne mesurerait pas le vrai comportement. */
        toggle: (node) => toggled.push(node.dataset.id),
      }
      let formOpened = 0
      let toggled = []
      document.addEventListener('click', (event) => {
        const node = event.target.closest('[data-action]')
        if (node) {
          const handler = HANDLERS[node.dataset.action]
          if (handler) {
            event.preventDefault()
            handler(node)
            return
          }
        }
        if (event.target.closest('[data-role="card-body"]')) formOpened += 1
      })
      document.addEventListener('keydown', (event) => {
        if (event.key !== 'Enter' && event.key !== ' ') return
        const zoomer = event.target.closest('[data-action="preview-color"], [data-action="preview-photo"]')
        if (zoomer) {
          event.preventDefault()
          HANDLERS[zoomer.dataset.action]?.(zoomer)
          return
        }
        if (event.target.closest('[data-role="card-body"]')) formOpened += 1
      })

      const dialogs = () => [...document.querySelectorAll('dialog[open]')]
      const closeAll = () => dialogs().forEach((d) => d.close())
      const wait = (ms) => new Promise((r) => setTimeout(r, ms))
      const click = (node) => node.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true }))
      const enter = (node) => node.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true }))

      const errors = []
      window.addEventListener('error', (e) => errors.push(`${e.message} @ ${e.filename}:${e.lineno}`))
      window.addEventListener('unhandledrejection', (e) => errors.push(`rejet : ${e.reason}`))

      const done = () => fetch('/__check/report', { method: 'POST', body: JSON.stringify({ results, errors, viewport: { w: innerWidth, h: innerHeight }, theme: document.documentElement.dataset.theme }) })

      try {
        /* --- Jetons : les deux thèmes doivent être complets --------------- */
        /* Une couleur oubliée dans le thème sombre ne se voit pas : elle
           retombe sur la valeur du thème clair, et le texte devient clair
           sur fond clair. On vérifie donc la présence ET l'opacité. */
        const TOKENS = [
          '--bg', '--surface', '--surface-2', '--surface-3',
          '--ink', '--ink-2', '--ink-3', '--muted', '--line', '--line-strong',
          '--accent', '--accent-dark', '--accent-soft', '--accent-line',
          '--coral', '--coral-soft', '--success', '--success-soft',
          '--warning', '--warning-soft', '--danger', '--danger-soft',
          '--info', '--info-soft', '--gold', '--gold-soft',
        ]
        const themeToken = (name) =>
          getComputedStyle(document.documentElement).getPropertyValue(name).trim()
        const startTheme = document.documentElement.dataset.theme
        const seen = {}
        for (const theme of ['light', 'dark']) {
          document.documentElement.dataset.theme = theme
          const missing = TOKENS.filter((name) => !themeToken(name))
          const empty = TOKENS.filter((name) => themeToken(name) === 'transparent')
          check(`jetons ${theme} : tous définis`, missing.length === 0, missing.join(' '))
          check(`jetons ${theme} : aucune valeur vide`, empty.length === 0, empty.join(' '))
          seen[theme] = {
            bg: themeToken('--bg'),
            surface: themeToken('--surface'),
            ink: themeToken('--ink'),
            ink3: themeToken('--ink-3'),
            accent: themeToken('--accent'),
          }
        }
        document.documentElement.dataset.theme = startTheme
        check('les deux thèmes ont un fond différent', seen.light.bg !== seen.dark.bg, `${seen.light.bg} / ${seen.dark.bg}`)

        /* --- Lisibilité : contraste de l'encre sur son fond -------------- */
        const lum = (hex) => {
          const m = hex.replace('#', '')
          if (m.length < 6) return null
          const parts = [0, 2, 4].map((i) => {
            const c = parseInt(m.slice(i, i + 2), 16) / 255
            return c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4
          })
          return 0.2126 * parts[0] + 0.7152 * parts[1] + 0.0722 * parts[2]
        }
        const ratio = (a, b) => {
          const la = lum(a)
          const lb = lum(b)
          if (la === null || lb === null) return 0
          return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05)
        }
        /* Texte courant : 4.5 est le seuil AA. Le serif enCorp 15 px n'a
           pas droit à la dérogation « grand texte ». */
        check('contraste encre sur fond (4.5)', ratio(seen.light.ink, seen.light.bg) >= 4.5, ratio(seen.light.ink, seen.light.bg).toFixed(2))
        check('contraste encre sur fond, thème sombre (4.5)', ratio(seen.dark.ink, seen.dark.bg) >= 4.5, ratio(seen.dark.ink, seen.dark.bg).toFixed(2))
        /* L'accent porte du texte (prix, lien, total) : même exigence. */
        check('contraste accent sur fond (4.5)', ratio(seen.light.accent, seen.light.bg) >= 4.5, ratio(seen.light.accent, seen.light.bg).toFixed(2))
        check('contraste accent sur fond, thème sombre (4.5)', ratio(seen.dark.accent, seen.dark.bg) >= 4.5, ratio(seen.dark.accent, seen.dark.bg).toFixed(2))
        /* Le texte secondaire est le plus à risque : `--ink-3` porte les
           notes et les métadonnées, c'est-à-dire tout ce qu'on survole. */
        check('contraste texte secondaire sur carte (4.5)', ratio(seen.light.ink3, seen.light.surface) >= 4.5, ratio(seen.light.ink3, seen.light.surface).toFixed(2))
        check('contraste texte secondaire sur carte, thème sombre (4.5)', ratio(seen.dark.ink3, seen.dark.surface) >= 4.5, ratio(seen.dark.ink3, seen.dark.surface).toFixed(2))

        /* --- Rendu des cartes --------------------------------------------- */
        check('cartes rendues', grid.querySelectorAll('article.product').length === items.length, grid.querySelectorAll('article.product').length)

        /* --- Fiche : UN seul visuel, en pleine largeur ------------------- */
        /* La 8.3 empilait photo puis bande de couleur, soit deux bandeaux
           successifs et une carte de 490 px. On vérifie qu'il n'y a plus
           qu'une zone de visuel, et qu'elle occupe toute la largeur utile. */
        const article = card('rgb')
        const hero = article.querySelector('.hero')
        const artStyle = getComputedStyle(article)
        const artContent = article.clientWidth - parseFloat(artStyle.paddingLeft) - parseFloat(artStyle.paddingRight)
        const heroBox = hero?.getBoundingClientRect()
        check('fiche : un seul visuel', hero && article.querySelectorAll('.hero').length === 1)
        check("fiche : plus de double bande", !article.querySelector('.product-color'))
        check('fiche : le visuel est en tête', article.firstElementChild === hero, article.firstElementChild?.className)
        check('fiche : le visuel occupe la largeur', heroBox && near(heroBox.width, artContent, 2), `${Math.round(heroBox?.width)} / ${Math.round(artContent)}`)
        check('fiche : le visuel a de la hauteur', heroBox && heroBox.height >= 140, `${Math.round(heroBox?.height)}px`)

        /* La photo remplit le visuel, pas seulement une bande de celui-ci. */
        const photoInHero = hero?.querySelector('img')
        check('fiche : la photo remplit le visuel', photoInHero && near(photoInHero.getBoundingClientRect().height, heroBox.height, 2), `${Math.round(photoInHero?.getBoundingClientRect().height)} / ${Math.round(heroBox?.height)}`)

        /* Le prix sort de la ligne de texte : c'est la donnée qu'on relit. */
        const price = card('rgb').querySelector('.price')
        check('fiche : le prix est mis en avant', price && parseFloat(getComputedStyle(price).fontSize) >= 18, price && getComputedStyle(price).fontSize)

        /* --- Couleur nommée : teinte déduite, nom écrit dessus ---------- */
        const namedHero = card('named').querySelector('.hero')
        const namedFill = namedHero?.querySelector('.hero-fill')
        check('couleur nommée : teinte déduite', namedFill && getComputedStyle(namedFill).backgroundColor === 'rgb(255, 215, 222)', namedFill && getComputedStyle(namedFill).backgroundColor)
        const namedColor = card('named').querySelector('.hero-color')
        check('fiche : le nom de la couleur est écrit', namedColor?.textContent.trim() === 'rose bébé', namedColor?.textContent)

        /* --- Couleur inconnue : le damier, jamais un noir inventé --------- */
        check("couleur inconnue : damier", Boolean(card('unknown').querySelector('.hero-fill--empty')))
        check("sans couleur : pas d'étiquette", !card('plain').querySelector('.hero-color'))
        check('sans photo ni couleur : un aplat neutre', Boolean(card('plain').querySelector('.hero-fill--blank')))

        /* --- Cibles tactiles : le visuel mène à son aperçu ---------------- */
        check('sans photo : pas de zone photo', !card('nophoto').querySelector('[data-action="preview-photo"]'))
        check('sans photo : pas d’image', !card('nophoto').querySelector('img'))
        check('avec photo : loupe présente', Boolean(card('rgb').querySelector('.hero .zoom-mark')))
        check('avec photo : aperçu au clic', Boolean(card('rgb').querySelector('.hero[data-action="preview-photo"]')))
        check('avec couleur : aperçu au clic', Boolean(card('named').querySelector('.hero[data-action="preview-color"]')))
        check('le visuel est-il joignable', getComputedStyle(card('named').querySelector('.hero')).cursor === 'zoom-in')
        check('le visuel se parcourt au clavier', card('named').querySelector('.hero').getAttribute('tabindex') === '0')

        /* --- Aperçu couleur -------------------------------------------------- */
        /* Sur `rgb`, la photo l'emporte : le visuel ouvre l'aperçu photo.
           L'aperçu couleur se teste donc sur `named`, dont le visuel est
           un aplat. */
        formOpened = 0
        click(card('named').querySelector('.hero'))
        let dlg = dialogs()[0]
        const bigSwatch = dlg?.querySelector('.preview-color')
        const facets = [...(dlg?.querySelectorAll('.preview-facet code') || [])].map((n) => n.textContent)
        check('aperçu couleur : ouvert', Boolean(dlg))
        check('aperçu couleur : grande boîte', bigSwatch && bigSwatch.getBoundingClientRect().height >= 200, `${Math.round(bigSwatch?.getBoundingClientRect().height)}px`)
        check('aperçu couleur : teinte correcte', bigSwatch && getComputedStyle(bigSwatch).backgroundColor === 'rgb(255, 215, 222)', bigSwatch && getComputedStyle(bigSwatch).backgroundColor)
        /* Une teinte déduite du nom n'a qu'un Hex : afficher un RVB
           calculé à partir de lui ferait croire à une valeur saisie. */
        check('aperçu couleur : nom + Hex', dlg?.querySelector('.preview-name')?.textContent === 'rose bébé' && facets.join('|') === '#ffd7de', facets.join('|'))
        check('aperçu couleur : la fiche ne s’ouvre pas', formOpened === 0, formOpened)
        dlg?.querySelector('[data-close]')?.click()
        await wait(40)
        check('aperçu : la croix ferme', dialogs().length === 0, dialogs().length)

        /* En revanche, une couleur saisie apporte les deux : le RVB doit
           alors être affiché, sinon la valeur saisie est perdue. */
        openColorPreview(byId('rgb'))
        dlg = dialogs()[0]
        const rgbFacets = [...(dlg?.querySelectorAll('.preview-facet code') || [])].map((n) => n.textContent)
        check('aperçu couleur saisie : nom + Hex + RVB', dlg?.querySelector('.preview-name')?.textContent === 'ivoire' && rgbFacets.join('|') === '#efe3d3|rgb(239, 227, 211)', rgbFacets.join('|'))
        closeAll()
        await wait(40)

        /* --- Aperçu photo ---------------------------------------------------- */
        formOpened = 0
        click(card('rgb').querySelector('[data-action="preview-photo"]'))
        dlg = dialogs()[0]
        const img = dlg?.querySelector('.preview-photo')
        check('aperçu photo : ouvert', Boolean(dlg))
        check('aperçu photo : image chargée', img && img.complete && img.naturalWidth === 800, img && `${img.naturalWidth}x${img.naturalHeight}`)
        check('aperçu photo : texte alternatif', img?.getAttribute('alt') === 'Ceinture satin ivoire', img?.getAttribute('alt'))
        check('aperçu photo : la fiche ne s’ouvre pas', formOpened === 0, formOpened)
        dlg?.dispatchEvent(new MouseEvent('click', { bubbles: true }))
        await wait(40)
        check('aperçu : clic à côté ferme', dialogs().length === 0, dialogs().length)

        /* --- Clavier -------------------------------------------------------- */
        formOpened = 0
        const colorEl = card('named').querySelector('.hero')
        enter(colorEl)
        check('clavier : Entrée ouvre l’aperçu couleur', dialogs().length === 1, dialogs().length)
        check('clavier : la fiche ne s’ouvre pas', formOpened === 0, formOpened)
        closeAll()
        await wait(40)

        /* --- Un produit acheté s’agrandit aussi ------------------------------ */
        click(card('bought').querySelector('[data-action="preview-photo"]'))
        check('produit acheté : aperçu photo', dialogs().length === 1, dialogs().length)
        closeAll()
        await wait(40)

        /* --- Un seul aperçu à la fois ---------------------------------------- */
        openColorPreview(byId('rgb'))
        openPhotoPreview(byId('rgb'))
        check('aperçus : pas d’empilement', dialogs().length === 1, dialogs().length)
        closeAll()
        await wait(40)

        /* --- Le reste de la carte ouvre toujours la fiche --------------------- */
        formOpened = 0
        click(card('rgb').querySelector('.product-name'))
        check('carte : le nom ouvre la fiche', formOpened === 1, formOpened)

        /* --- Les trois présentations ---------------------------------------- */
        /* `icon()` rend une chaîne vide pour un nom inconnu, sans erreur :
           une faute de frappe dans le réglage passerait donc inaperçue. */
        check(
          'réglages : chaque présentation a son icône',
          CARD_LAYOUTS.every((item) => icon(item.icon, 14).includes('<svg')),
          CARD_LAYOUTS.filter((item) => !icon(item.icon, 14).includes('<svg')).map((item) => item.icon).join(','),
        )
        check(
          'réglages : trois présentations distinctes',
          CARD_LAYOUTS.length === 3 && new Set(CARD_LAYOUT_VALUES).size === 3,
          CARD_LAYOUT_VALUES.join(','),
        )
        check('réglages : la fiche est le mode par défaut', CARD_LAYOUT_VALUES[0] === 'card', CARD_LAYOUT_VALUES.join(','))

        /* Le mode par défaut doit rester la fiche complète : c'est ce que
           voient tous ceux qui n'ont jamais touché au réglage. */
        check(
          'mode par défaut : la fiche complète',
          renderProductCard(items[0]).includes('product-actions'),
          'product-actions absent',
        )

        for (const layout of LAYOUTS) {
          const host = layouts.querySelector(`[data-layout="${layout}"]`)
          const box = host.getBoundingClientRect()
          check(`${layout} : un article par produit`, host.querySelectorAll('article.product').length === items.length, host.querySelectorAll('article.product').length)
          check(`${layout} : rien ne dépasse la grille`, host.scrollWidth <= host.clientWidth + 1, `${host.scrollWidth} / ${host.clientWidth}`)

          /* Un mode qui cacherait la photo ou le prix supprimerait
             l'information : chaque présentation doit les garder. */
          check(`${layout} : la photo s'agrandit encore`, Boolean(host.querySelector('article[data-id="rgb"] [data-action="preview-photo"]')))
          check(`${layout} : le prix est affiché`, /\d/.test(host.querySelector('article[data-id="rgb"]').textContent))

          /* Le clic doit ouvrir la fiche dans les trois modes. */
          formOpened = 0
          click(host.querySelector('[data-role="card-body"]'))
          check(`${layout} : le clic ouvre la fiche`, formOpened === 1, formOpened)

          /* Et la coche doit rester joignable, sans ouvrir la fiche. */
          toggled = []
          formOpened = 0
          click(host.querySelector('[data-action="toggle"]'))
          check(`${layout} : la coche est atteignable`, toggled.length === 1 && formOpened === 0, `${toggled.join(',')} / ${formOpened}`)
        }

        /* --- Mosaïque : des carrés, quatre par ligne, rien de tronqué --------- */
        const mosaic = layouts.querySelector('[data-layout="mosaic"]')
        const tileBoxes = [...mosaic.querySelectorAll('.tile')].map((node) => node.getBoundingClientRect())
        const skewed = tileBoxes.filter((b) => !near(b.width, b.height, 3))
        check('mosaïque : les tuiles sont carrées', skewed.length === 0, skewed.map((b) => `${Math.round(b.width)}x${Math.round(b.height)}`).join(' '))
        /* La case de la mosaïque et la ligne de réglage ne doivent pas
           partager le nom `.tile` : sinon la ligne de réglage impose sa
           marge et son centrage à chaque case, et la photo rétrécit. */
        const firstTileStyle = getComputedStyle(mosaic.querySelector('.tile'))
        check('mosaïque : aucune marge injectée par un réglage', parseFloat(firstTileStyle.paddingTop) === 0, firstTileStyle.padding)
        const mosaicCols = getComputedStyle(mosaic).gridTemplateColumns.split(' ').filter(Boolean).length
        const expectedCols = innerWidth >= 1024 ? 4 : innerWidth >= 560 ? 3 : 2
        check('mosaïque : colonnes adaptées à la largeur', mosaicCols === expectedCols, `${mosaicCols} colonnes à ${innerWidth}px (attendu ${expectedCols})`)

        /* La barre est un bandeau en dégradé posé sur le bas de la photo :
           le nom et le prix restent lisibles sans rendre la case à la photo. */
        const tile = mosaic.querySelector('article[data-id="rgb"] .tile')
        const tileBox = tile.getBoundingClientRect()
        const visual = tile.querySelector('.tile-visual').getBoundingClientRect()
        const bar = tile.querySelector('.tile-bar').getBoundingClientRect()
        check('mosaïque : la barre est ancrée en bas', near(bar.bottom, tileBox.bottom, 2) && near(bar.width, tileBox.width, 2), `${Math.round(bar.bottom)} / ${Math.round(tileBox.bottom)}`)
        check('mosaïque : la barre reste un bandeau', bar.height <= tileBox.height * 0.4, `${Math.round(bar.height)}px sur ${Math.round(tileBox.height)}px`)
        check('mosaïque : le visuel remplit la largeur', near(visual.width, bar.width, 2), `${Math.round(visual.width)} / ${Math.round(bar.width)}`)

        /* Le reproche le plus facile à recevoir sans s'en apercevoir : une
           photo qui n'occupe plus qu'un tiers de la case. On mesure sa part
           réelle, pas son `object-fit`. */
        const photoTile = mosaic.querySelector('article[data-id="rgb"]')
        const photoVisual = photoTile.querySelector('.tile-visual').getBoundingClientRect()
        const photoShare = (photoVisual.height / photoTile.getBoundingClientRect().height) * 100
        check('mosaïque : la photo occupe la majeure partie', photoShare >= 75, `${photoShare.toFixed(0)}% de la case`)

        /* La couleur doit être un aplat, pas une bande voilée : un voile
          la mange et la case finit par ressembler à une étiquette sombre.
          On vérifie la couleur de fond exacte du visuel. */
        const flat = mosaic.querySelector('article[data-id="named"] .cv--color')
        check('mosaïque : la couleur est un aplat pur', getComputedStyle(flat).backgroundColor === 'rgb(255, 215, 222)', getComputedStyle(flat).backgroundColor)
        const flatVisual = mosaic.querySelector('article[data-id="named"] .tile-visual').getBoundingClientRect()
        check('mosaïque : l’aplat remplit la case', near(flatVisual.width, flat.getBoundingClientRect().width, 2) && near(flatVisual.height, flat.getBoundingClientRect().height, 2), `${Math.round(flat.getBoundingClientRect().width)}x${Math.round(flat.getBoundingClientRect().height)}`)

        /* Le nom de la couleur est écrit, pas rogné dans la case. */
        const tag = mosaic.querySelector('article[data-id="named"] .tile-tag')
        check('mosaïque : le nom de la couleur est écrit', tag?.textContent.trim() === 'rose bébé', tag?.textContent)
        check('mosaïque : l’étiquette est opaque', tag && !/transparent/.test(getComputedStyle(tag).backgroundColor), tag && getComputedStyle(tag).backgroundColor)

        const tileName = tile.querySelector('.tile-name')
        check('mosaïque : le nom est lisible', tileName.getBoundingClientRect().height >= 14 && tileName.textContent.trim().length > 0, `${Math.round(tileName.getBoundingClientRect().height)}px`)
        /* La tuile la plus petite reste assez grande pour qu'on vise juste. */
        const smallest = Math.min(...tileBoxes.map((b) => b.width))
        check('mosaïque : tuiles assez larges', smallest >= 100, `${Math.round(smallest)}px`)
        const tileCheck = mosaic.querySelector('.tile-check').getBoundingClientRect()
        check('mosaïque : la coche se vise au doigt', tileCheck.height >= (innerWidth <= 720 ? 40 : 32), `${Math.round(tileCheck.height)}px`)

        /* --- Liste : une ligne par produit, et nettement plus basse ----------- */
        const rows = layouts.querySelector('[data-layout="row"]')
        const rowBoxes = [...rows.querySelectorAll('.product--row')].map((node) => node.getBoundingClientRect())
        check('liste : une seule colonne', getComputedStyle(rows).gridTemplateColumns.split(' ').filter(Boolean).length === 1)
        check('liste : lignes de hauteur contenue', rowBoxes.every((b) => b.height <= 96), `${Math.round(Math.max(...rowBoxes.map((b) => b.height)))}px`)
        check('liste : la mosaïque est bien plus basse que la fiche', Math.max(...rowBoxes.map((b) => b.height)) < Math.min(...[...grid.querySelectorAll('article.product')].map((n) => n.getBoundingClientRect().height)), `${Math.round(Math.max(...rowBoxes.map((b) => b.height)))}px / ${Math.round(Math.min(...[...grid.querySelectorAll('article.product')].map((n) => n.getBoundingClientRect().height)))}px`)
        const rowVisual = rows.querySelector('.row-visual').getBoundingClientRect()
        check('liste : vignette carrée', near(rowVisual.width, rowVisual.height, 2), `${Math.round(rowVisual.width)}x${Math.round(rowVisual.height)}`)
        check('liste : la vignette se voit', rowVisual.width >= 44, `${Math.round(rowVisual.width)}px`)
        check('liste : la ligne ne déborde pas', rowBoxes.every((b) => b.right <= mosaic.getBoundingClientRect().right + 1))
        const rowName = rows.querySelector('article[data-id="rgb"] .row-name')
        check('liste : le nom est lisible', rowName.getBoundingClientRect().height >= 14 && rowName.textContent.trim().length > 0, `${Math.round(rowName.getBoundingClientRect().height)}px`)

        /* Le nom de la couleur doit être écrit dans la ligne, y compris pour
           un produit qui a une photo : posé dans une vignette de 56 px, il
           serait rogné au milieu d'un mot. */
        const rowMetaColor = rows.querySelector('article[data-id="named"] .row-meta')?.textContent || ''
        check('liste : la couleur est écrite dans la ligne', rowMetaColor.includes('rose bébé'), rowMetaColor)
        const rowMetaPhoto = rows.querySelector('article[data-id="rgb"] .row-meta')?.textContent || ''
        check('liste : la couleur survit à la photo', rowMetaPhoto.includes('ivoire'), rowMetaPhoto)
        check('liste : rien n’est écrit dans la vignette', !rows.querySelector('.row-visual .color-chip') && !rows.querySelector('.row-visual .hero'))

        /* --- Aucun mode ne doit produire une case sans visuel ---------------- */
        /* Sans photo ni couleur, la case reste un aplat neutre : ce qui
           compte, c'est qu'elle ne soit pas vide de 0 px de haut. */
        for (const layout of LAYOUTS) {
          const blank = layouts.querySelector(`[data-layout="${layout}"] article[data-id="plain"]`)
          const blankVisual = blank.querySelector('.hero, .tile-visual, .row-visual')
          const b = blankVisual?.getBoundingClientRect()
          check(`${layout} : la case garde un visuel`, b && b.width >= 40 && b.height >= 40, b && `${Math.round(b.width)}x${Math.round(b.height)}`)
        }


        /* --- Coque : rail, barre haute, dock flottant, FAB --------------- */
        /* On reconstruit la coque réelle (index.html + shell.js) plutôt que
           de la mesurer dans l'application : elle est ainsi vérifiée même
           quand la liste de produits est vide. */
        const shell = document.getElementById('shell')
        shell.innerHTML = `
          <div class="app">
            <aside class="rail" aria-label="Barre latérale">
              <a class="rail-brand" href="#/liste">
                <span class="rail-logo">S<span>&amp;</span>T</span>
                <span class="rail-name"><strong>Mes achats</strong><small>Sashes &amp; tissus</small></span>
              </a>
              <button type="button" class="rail-add"><span>Ajouter un produit</span><kbd>N</kbd></button>
              <nav class="rail-nav" id="rail-nav">
                <a class="rail-link is-active" href="#/liste">Liste</a>
                <a class="rail-link" href="#/factures">Factures</a>
                <a class="rail-link" href="#/depenses">Dépenses</a>
                <a class="rail-link" href="#/analyse">Analyse</a>
              </nav>
              <div class="rail-foot">
                <a class="rail-link" href="#/reglages" data-route="reglages"><span>Réglages</span></a>
                <button type="button" class="sync-card is-ready">
                  <span class="sync-card-head">À jour</span><small>à l’instant</small>
                </button>
              </div>
            </aside>
            <div class="workspace">
              <header class="topbar">
                <a class="topbar-brand" href="#/liste">
                  <span class="topbar-logo">S<span>&amp;</span>T</span>
                  <span class="topbar-title" id="screen-title">Liste</span>
                </a>
                <div class="topbar-actions">
                  <button type="button" class="sync-mini is-ready"></button>
                  <a class="topbar-btn" href="#/reglages" aria-label="Réglages"></a>
                </div>
              </header>
              <main class="page">
                <section class="view">
                  <header class="screen-head">
                    <div class="screen-head-main">
                      <span class="screen-eyebrow">Carnet d’achats</span>
                      <h1 class="screen-title">Ma liste</h1>
                      <p class="screen-sub">Ce que je dois acheter chez le grossiste.</p>
                    </div>
                    <div class="screen-stats">
                      <div class="stat"><span class="stat-label">À acheter</span><span class="stat-value">12</span></div>
                      <div class="stat stat--accent"><span class="stat-label">Total estimé</span><span class="stat-value">48 000 DA</span></div>
                    </div>
                  </header>
                  <div class="filterbar">
                    <div class="filterbar-search">
                      <label class="input-wrap"><input type="search" placeholder="Rechercher" /></label>
                    </div>
                    <div class="filterbar-tabs" role="tablist">
                      <button type="button" class="tabchip is-active">Toutes</button>
                      <button type="button" class="tabchip">À acheter</button>
                    </div>
                    <div class="filterbar-chips scroller">
                      <button type="button" class="chip is-active">Couture</button>
                      <button type="button" class="chip">Tissus</button>
                    </div>
                  </div>
                  <div class="list-toolbar">
                    <span class="list-toolbar-label">Tri &amp; présentation</span>
                    <select class="select list-sort"><option>Plus récents</option></select>
                    <div class="layout-switch" role="group">
                      <button type="button" class="is-active" aria-pressed="true"></button>
                      <button type="button" aria-pressed="false"></button>
                      <button type="button" aria-pressed="false"></button>
                    </div>
                  </div>
                  <div class="empty">
                    <span class="empty-mark"></span>
                    <div class="empty-copy">
                      <strong>Votre liste est vide</strong>
                      <p>Ajoutez un article pour commencer.</p>
                    </div>
                  </div>
                </section>
              </main>
            </div>
            <nav class="dock"><div class="dock-inner">
              <a class="tab is-active" href="#/liste"><span class="tab-icon">L</span><span class="tab-label">Liste</span></a>
              <a class="tab" href="#/factures"><span class="tab-icon">F</span><span class="tab-label">Factures</span></a>
              <a class="tab" href="#/depenses"><span class="tab-icon">D</span><span class="tab-label">Dépenses</span></a>
              <button type="button" class="tab tab--add" data-action="fab-add" aria-label="Ajouter"><span class="tab-icon">+</span><span class="tab-label">Ajouter</span></button>
              <a class="tab" href="#/analyse"><span class="tab-icon">A</span><span class="tab-label">Analyse</span></a>
            </div></nav>
            <button type="button" class="fab" aria-label="Ajouter un produit">+</button>
          </div>`

        const shellBox = shell.getBoundingClientRect()
        check('coque : rendue', shellBox.width > 0, `${Math.round(shellBox.width)}px`)
        check('coque : pas de débordement', shell.scrollWidth <= shell.clientWidth + 1, `${shell.scrollWidth} / ${shell.clientWidth}`)
        const shellWide = [...shell.querySelectorAll('*')].filter((n) => n.scrollWidth > n.clientWidth + 1 && getComputedStyle(n).overflowX === 'visible')
        check('coque : aucun bloc trop large', shellWide.length === 0, shellWide.map((n) => n.className || n.tagName).join(','))

        /* Une seule navigation par taille d'écran : le rail au bureau, le
           dock sur téléphone. Les deux ensemble doubleraient les entrées. */
        const desktop = innerWidth >= 1024
        const rail = shell.querySelector('.rail')
        const topbar = shell.querySelector('.topbar')
        const dock = shell.querySelector('.dock')
        const fab = shell.querySelector('.fab')
        const shown = (node) => Boolean(node) && getComputedStyle(node).display !== 'none'
        const railShown = shown(rail)
        const dockShown = shown(dock)
        check('coque : le rail prend le relais au bureau', railShown === desktop, `${innerWidth}px → ${railShown ? 'rail' : 'pas de rail'}`)
        check('coque : une seule navigation visible', railShown !== dockShown, `rail ${railShown} / dock ${dockShown}`)

        /* Rail : la marque, l'ajout, les quatre écrans, les réglages et la
           synchronisation — tout au même endroit, sans barre d'onglets. */
        if (railShown) {
          check('rail : collé en haut', getComputedStyle(rail).position === 'sticky', getComputedStyle(rail).position)
          check('rail : quatre écrans + réglages', rail.querySelectorAll('.rail-link').length === 5, rail.querySelectorAll('.rail-link').length)
          const addBox = rail.querySelector('.rail-add')?.getBoundingClientRect()
          check('rail : l’ajout est une action pleine largeur', addBox && addBox.width >= 180, `${Math.round(addBox?.width || 0)}px`)
          check('rail : la synchronisation est dans le pied', Boolean(rail.querySelector('.rail-foot .sync-card')))
        }

        /* Barre haute : le titre de l'écran et la sync, sur téléphone. */
        check('barre haute : visible sur téléphone', shown(topbar) === !desktop, getComputedStyle(topbar).display)
        check('barre haute : collante', getComputedStyle(topbar).position === 'sticky', getComputedStyle(topbar).position)
        check('barre haute : titre de l’écran', topbar?.querySelector('#screen-title')?.textContent.trim() === 'Liste', topbar?.querySelector('#screen-title')?.textContent)
        check('barre haute : la sync est à portée', Boolean(topbar?.querySelector('.sync-mini')))

        /* Dock : la navigation permanente, quatre entrées, à portée du pouce. */
        const tabs = [...shell.querySelectorAll('.tab')]
        check('dock : posé en bas', getComputedStyle(dock).position === 'fixed', getComputedStyle(dock).position)
        check('dock : cinq entrées', tabs.length === 5, tabs.length)
        check('dock : masqué au bureau', shown(dock) === !desktop, getComputedStyle(dock).display)
        if (dockShown) {
          check('dock : cibles d’au moins 44 px', tabs.every((t) => t.getBoundingClientRect().height >= 44), tabs.map((t) => Math.round(t.getBoundingClientRect().height)).join('/'))
          const addTabs = tabs.filter((t) => t.classList.contains('tab--add'))
          check('dock : une seule entrée d’ajout', addTabs.length === 1, addTabs.length)
          /* L'ajout doit se distinguer sans crier : une pastille ronde sur
             l'accent, plus large qu'une icône ordinaire. */
          const disc = addTabs[0] && addTabs[0].querySelector('.tab-icon')
          const discBox = disc ? disc.getBoundingClientRect() : { width: 0, height: 0 }
          check(
            'dock : l’ajout est une pastille ronde',
            discBox.width >= 34 && near(discBox.width, discBox.height, 1),
            `${Math.round(discBox.width)}x${Math.round(discBox.height)}`,
          )
        }

        /* FAB : le dock a repris l'ajout. Le bouton reste dans le document
           pour les raccourcis clavier, mais ne doit plus rien recouvrir. */
        check('bouton flottant : retiré, le dock porte l’ajout', !shown(fab), getComputedStyle(fab).display)

        /* Filtres : trois questions distinctes, trois lignes. La barre n'est
           plus collante — c'est l'en-tête qui porte le contexte. */
        const filterBar = shell.querySelector('.filterbar')
        const barSearch = filterBar?.querySelector('.filterbar-search')?.getBoundingClientRect()
        const barTabs = filterBar?.querySelector('.filterbar-tabs')?.getBoundingClientRect()
        const barChips = filterBar?.querySelector('.filterbar-chips')?.getBoundingClientRect()
        check('filtres : les trois couches existent', Boolean(barSearch && barTabs && barChips))
        check('filtres : recherche au-dessus du statut', barSearch && barTabs && barSearch.bottom <= barTabs.top + 1, `${Math.round(barSearch?.bottom)} / ${Math.round(barTabs?.top)}`)
        check('filtres : statut au-dessus des catégories', barTabs && barChips && barTabs.bottom <= barChips.top + 1, `${Math.round(barTabs?.bottom)} / ${Math.round(barChips?.top)}`)
        check('filtres : le statut partage la largeur', barTabs && barSearch && near(barTabs.width, barSearch.width, 2), `${Math.round(barTabs?.width)} / ${Math.round(barSearch?.width)}`)

        /* Tri & présentation : sous les filtres, au-dessus des résultats. */
        const toolbar = shell.querySelector('.list-toolbar')
        check('tri : un sélecteur de tri', Boolean(toolbar?.querySelector('.list-sort')))
        check('présentation : trois boutons', toolbar?.querySelectorAll('.layout-switch button').length === 3, toolbar?.querySelectorAll('.layout-switch button').length)
        check('tri : la barre suit les filtres', Boolean(toolbar && filterBar && toolbar.getBoundingClientRect().top >= filterBar.getBoundingClientRect().bottom - 1))

        /* État vide : le titre reste dans la colonne, et le repère est bien
           posé — c'est lui qui remplace la boîte vide. */
        check('état vide : repère présent', Boolean(shell.querySelector('.empty .empty-mark')))
        const emptyBox = shell.querySelector('.empty-copy strong')?.getBoundingClientRect()
        const pageBox = shell.querySelector('.page').getBoundingClientRect()
        check('état vide : titre dans la colonne', emptyBox && emptyBox.width <= pageBox.width + 1, `${Math.round(emptyBox?.width)} / ${Math.round(pageBox.width)}`)
        const brandMark = desktop ? shell.querySelector('.rail-logo') : shell.querySelector('.topbar-logo')
        const brandText = desktop ? shell.querySelector('.rail-name strong') : shell.querySelector('.topbar-title')
        check('coque : marque et titre visibles', brandMark.getBoundingClientRect().width > 0 && brandText.getBoundingClientRect().width > 0, `${Math.round(brandMark.getBoundingClientRect().width)} / ${Math.round(brandText.getBoundingClientRect().width)}`)

        check('aucune erreur JavaScript', errors.length === 0, errors.join(' | '))

        /* --- Direction artistique : ce qui ne se mesure pas à l'œil -------- */
        /* Le titre de la carte doit rester dans la famille d'affichage de
           l'Atelier : un retour à la sans-serif du corps passerait inaperçu. */
        const nameStyle = getComputedStyle(card('rgb').querySelector('.product-name'))
        check('titre de carte dans la police d’affichage', /Bricolage|sans-serif/.test(nameStyle.fontFamily), nameStyle.fontFamily)
        check('titre de carte : corps lisible', parseFloat(nameStyle.fontSize) >= 15, `${nameStyle.fontSize}`)

        /* Aucune carte ne doit déborder de la grille, et rien ne doit
           dépasser horizontalement : c'est le symptôme le plus fréquent
           d'un rayon ou d'un espacement mal repris. */
        check('aucun débordement horizontal', document.documentElement.scrollWidth <= innerWidth + 1, `${document.documentElement.scrollWidth} / ${innerWidth}`)
        const overflowing = [...grid.querySelectorAll('article.product')].filter((node) => node.scrollWidth > node.clientWidth + 1)
        check('aucune carte tronquée', overflowing.length === 0, overflowing.length)

        await done()
      } catch (error) {
        results.push({ name: 'exception : ' + error.message, pass: false, detail: String(error.stack || '') })
        errors.forEach((message) => results.push({ name: 'erreur JS : ' + message, pass: false, detail: '' }))
        await done()
      }
    </script>
  </body>
</html>
